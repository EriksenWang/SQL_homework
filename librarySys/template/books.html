<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

    <h1>书籍清单</h1>
    <div>
        <a href="/select_book"> 查找</a>
    <table>
        <thead>
        <tr>
            <th>书号</th>
            <th>书名</th>
            <th>位置</th>
            <th>价格</th>
        </tr>
        </thead>
        <tbody>
        {% for row in book_list %}
            <tr>
                <td>{{ row.书号 }}</td>
                <td>{{ row.书名 }}</td>
                <td>{{ row.位置 }}</td>
                <td>{{ row.价格 }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</body>
</html>
