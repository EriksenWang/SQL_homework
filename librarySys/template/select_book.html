<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>查询书籍位置</h1>
    <form method="POST" action="/select_book/">
    {% csrf_token %}
        <p>书名：<input type="text" name="title"/></p>
        <input type="submit" value="提交" />
    </form>
    <table>
        <thead>
        <tr>
            <th>书号</th>
            <th>书名</th>
            <th>位置</th>
            <th>价格</th>
        </tr>
        </thead>
        <tbody>
        {% for row in book_list %}
            <tr>
                <td>{{ row.书号 }}</td>
                <td>{{ row.书名 }}</td>
                <td>{{ row.位置 }}</td>
                <td>{{ row.价格 }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>    
       
</body>
</html>
